{% extends 'ele/base.html' %}

{% block content %}
<div class="container flex flex-col">
    <h1 class="font-bold text-4xl text-center text-white mt-20"> Signup will be available soon...</h1>
</div>

<div class="container mx-auto mt-8">
    <h1 class="text-3xl font-bold mb-8 text-center">Signup</h1>
    <form class="w-full max-w-md bg-white rounded-lg shadow-md p-8 border border-gray-300 mx-auto" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4 w-full">
            Signup
        </button>
    </form>
</div>

<style>
   

    /* Style the form */
    form {
        border-radius: 4px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        padding: 20px;
    }

    /* Style the form fields */
    form input[type="text"],
    form input[type="email"],
    form input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    /* Style the submit button */
    form button[type="submit"] {
        background-color: #4CAF50;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
    }

    /* Hover effect for the submit button */
    form button[type="submit"]:hover {
        background-color: #45a049;
    }

    /* Style the form header */
    form h1 {
        font-size: 2.5rem;
        margin-bottom: 2rem;
        text-align: center;
        color: #333;
    }
</style>

{% endblock %}
